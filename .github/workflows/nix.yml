name: nix

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".dagger/**"
      - "dagger.toml"
      - "dagger.lock"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/nix.yml"
  pull_request:
    paths:
      - "cli/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".dagger/**"
      - "dagger.toml"
      - "dagger.lock"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/nix.yml"
  workflow_dispatch:

jobs:
  build:
    name: nix build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16
      
      - uses: cachix/cachix-action@v17
        with:
          name: atradio
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Build the root default package (built from the ./cli source).
      # Retry once to ride out transient github.com 5xx while fetching inputs.
      - name: nix build
        run: |
          for i in {1..5}; do
            if GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} nix build -L --accept-flake-config; then
              echo "Build succeeded!"
              exit 0
            fi
            echo "Attempt $i failed (likely GitHub 503/rate limit), retrying in $((i*10))s..."
            sleep $((i*10))
          done
          echo "Build failed after retries"
          exit 1

  linux:
    name: nix build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Dagger
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77
        with:
          version: v1.0.0-beta.21

      - name: Build with PureScript Dagger
        working-directory: .dagger
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          WORKFLOW_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: dagger api call -m ci nix-build --source .. --cachix-token env://CACHIX_AUTH_TOKEN --run-id "$WORKFLOW_RUN"
