name: nix

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".dagger/**"
      - "dagger.toml"
      - "dagger.lock"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/nix.yml"
      - .fluentci/**
      - fluentci.toml
      - .github/actions/fluentci-toolchain/**
  pull_request:
    paths:
      - "cli/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".dagger/**"
      - "dagger.toml"
      - "dagger.lock"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/nix.yml"
      - .fluentci/**
      - fluentci.toml
      - .github/actions/fluentci-toolchain/**
  workflow_dispatch:

jobs:
  build:
    name: nix build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout FluentCI tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tooling
      - uses: fluentci-io/setup-fluentci@next
      - uses: ./.ci-tooling/.github/actions/fluentci-toolchain
      - name: Set up determinate-nix
        run: fluentci run setup-determinate-nix setup --sudo --trusted-users '["runner"]' --extra-conf '["experimental-features = nix-command flakes"]' | node "$GITHUB_WORKSPACE/.ci-tooling/.fluentci/github-env.mjs"
        shell: bash
      - name: Configure Cachix with FluentCI
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci cachix --directory "$GITHUB_WORKSPACE" --operation setup --cache atradio
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: nix build
        run: |-
          fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci nix-build --source "$GITHUB_WORKSPACE" --target ".#default" --cache atradio

        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push result to Cachix
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci cachix --directory "$GITHUB_WORKSPACE" --operation push --cache atradio
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    defaults:
      run:
        shell: bash
  linux:
    name: nix build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout FluentCI tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tooling
      - uses: fluentci-io/setup-fluentci@next
      - uses: ./.ci-tooling/.github/actions/fluentci-toolchain
      - name: Set up Nix with FluentCI
        run: fluentci run setup-determinate-nix setup --sudo --trusted-users '["runner"]' --extra-conf '["experimental-features = nix-command flakes"]' | node "$GITHUB_WORKSPACE/.ci-tooling/.fluentci/github-env.mjs"
      - name: Build with PureScript FluentCI
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          WORKFLOW_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci nix-build --source "$GITHUB_WORKSPACE/.dagger/.." --target ".#default" --cache atradio
    defaults:
      run:
        shell: bash
