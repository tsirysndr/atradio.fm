name: nix

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".dagger/**"
      - "dagger.toml"
      - "dagger.lock"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/nix.yml"
      - .fluentci/**
      - fluentci.toml
      - .github/actions/fluentci-toolchain/**
  pull_request:
    paths:
      - "cli/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".dagger/**"
      - "dagger.toml"
      - "dagger.lock"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/nix.yml"
      - .fluentci/**
      - fluentci.toml
      - .github/actions/fluentci-toolchain/**
  workflow_dispatch:

jobs:
  build:
    name: nix build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout FluentCI tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tooling
      - uses: fluentci-io/setup-fluentci@next
      - uses: ./.ci-tooling/.github/actions/fluentci-toolchain
      - name: Set up determinate-nix
        run: fluentci run setup-determinate-nix setup --sudo --trusted-users '["runner"]' --extra-conf '["experimental-features = nix-command flakes"]' | node "$GITHUB_WORKSPACE/.ci-tooling/.fluentci/github-env.mjs"
        shell: bash
      - name: Configure Cachix with FluentCI
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci cachix --directory "$GITHUB_WORKSPACE" --operation setup --cache atradio
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: nix build
        run: |
          for i in {1..5}; do
            if GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} nix build -L --accept-flake-config; then
              echo "Build succeeded!"
              exit 0
            fi
            echo "Attempt $i failed (likely GitHub 503/rate limit), retrying in $((i*10))s..."
            sleep $((i*10))
          done
          echo "Build failed after retries"
          exit 1

      - name: Push result to Cachix
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci cachix --directory "$GITHUB_WORKSPACE" --operation push --cache atradio
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    defaults:
      run:
        shell: bash
  linux:
    name: nix build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout FluentCI tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tooling
      - uses: fluentci-io/setup-fluentci@next
      - uses: ./.ci-tooling/.github/actions/fluentci-toolchain
      - name: Set up the pinned Dagger beta with FluentCI
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci setup-dagger
        shell: bash
      - name: Build with PureScript FluentCI
        working-directory: .dagger
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          WORKFLOW_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci dagger --directory "$GITHUB_WORKSPACE/.dagger" --arguments '["api","call","-m","ci","nix-build","--source","..","--cachix-token","env://CACHIX_AUTH_TOKEN","--run-id","$WORKFLOW_RUN"]'
    defaults:
      run:
        shell: bash
