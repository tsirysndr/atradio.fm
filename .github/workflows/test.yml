name: test

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "sdk/typescript/**"
      - ".dagger/**"
      - "dagger.toml"
      - "dagger.lock"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".github/workflows/test.yml"
      - .fluentci/**
      - fluentci.toml
      - .github/actions/fluentci-toolchain/**
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "sdk/typescript/**"
      - ".dagger/**"
      - "dagger.toml"
      - "dagger.lock"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".github/workflows/test.yml"
      - .fluentci/**
      - fluentci.toml
      - .github/actions/fluentci-toolchain/**
  workflow_dispatch:

jobs:
  test:
    name: typecheck + test (apps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout FluentCI tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tooling
      - uses: fluentci-io/setup-fluentci@next
      - uses: ./.ci-tooling/.github/actions/fluentci-toolchain
      - name: Typecheck and test apps
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci apps --source "$GITHUB_WORKSPACE/.dagger/.."
    defaults:
      run:
        shell: bash
