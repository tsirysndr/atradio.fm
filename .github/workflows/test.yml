name: test

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "sdk/typescript/**"
      - ".dagger/**"
      - "dagger.toml"
      - "dagger.lock"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "sdk/typescript/**"
      - ".dagger/**"
      - "dagger.toml"
      - "dagger.lock"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".github/workflows/test.yml"
  workflow_dispatch:

jobs:
  test:
    name: typecheck + test (apps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dagger
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77
        with:
          version: v1.0.0-beta.21

      - name: Typecheck and test apps
        working-directory: .dagger
        run: dagger api call -m ci apps --source ..
