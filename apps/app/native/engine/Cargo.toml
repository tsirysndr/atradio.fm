[package]
name = "atradio-engine"
version = "0.1.0"
edition = "2021"
description = "Native playback engine for the Rocksky mobile app — rockbox-playback behind a JSON-over-JNI command interface"
license = "GPL-2.0-or-later"
publish = false

[lib]
name = "atradio_engine"
crate-type = ["cdylib"]

[dependencies]
atradio-sdk = { path = "../../../../crates/atradio-sdk" }
jacquard = { version = "0.12", default-features = false, features = ["api", "dns", "derive", "cache", "loopback"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "sync", "macros"] }

rockbox-playback = { version = "0.7", path = "vendor/rockbox-playback" }
# Feature union: make reqwest (pulled by rockbox-playback's http feature)
# carry the webpki root store too — rustls-native-certs has nothing to read
# on Android, which would otherwise break https stream URLs.
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "rustls-tls-webpki-roots",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[profile.release]
lto = true
strip = true

[workspace]
